name: turanta_xpert
description: "Turanta Xpert — partner app for check-in, jobs, and earnings."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State + hooks + routing
  flutter_hooks: ^0.20.5
  hooks_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Network
  dio: ^5.10.0
  talker: ^4.6.4
  talker_dio_logger: ^4.6.4

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  firebase_messaging: ^15.0.0
  firebase_crashlytics: ^4.0.0
  firebase_analytics: ^11.0.0

  # Storage
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5

  # i18n / formatting
  intl: ^0.20.3
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.0
  image_picker: ^1.2.3
  uuid: ^4.5.3
  flutter_local_notifications: ^19.0.0
  geolocator: ^13.0.2
  battery_plus: ^6.2.1
  connectivity_plus: ^6.1.4
  url_launcher: ^6.3.1
  google_maps_flutter: ^2.18.0
  google_maps_flutter_android: ^2.19.10
  google_maps_flutter_platform_interface: ^2.16.0
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/i18n/
